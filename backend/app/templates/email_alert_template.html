<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{ subject }}</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f5f5f5; padding:20px;">
  <table width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background:#fff; border-radius:8px; padding:32px;">
          <tr>
            <td>
              <h1 style="color:#0f172a; font-size:20px; margin:0 0 16px 0;">
                {{ title }}
              </h1>
              <p style="color:#334155; font-size:14px; line-height:1.6;">
                {{ body }}
              </p>
              {% if cta_url %}
              <p style="margin-top:24px;">
                <a href="{{ cta_url }}"
                   style="background:#2563eb; color:#fff; padding:10px 20px; border-radius:6px; text-decoration:none; font-size:14px;">
                  {{ cta_text or 'View Details' }}
                </a>
              </p>
              {% endif %}
              <hr style="margin:32px 0; border:none; border-top:1px solid #e2e8f0;">
              <p style="color:#94a3b8; font-size:12px;">
                Autonomous AI Market Research Agent
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
